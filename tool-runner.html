<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis Vault | Tool Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#020608; --bg2:#060d10; --bg3:#0a1520;
    --accent:#00f5c4; --accent2:#00a8ff; --accent3:#ff003c;
    --text:#c8e6f0; --text-dim:#4a7a8a; --border:#0f2a35;
    --glow:0 0 20px rgba(0,245,196,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:linear-gradient(rgba(0,245,196,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,196,0.02) 1px,transparent 1px);
    background-size:40px 40px; pointer-events:none; z-index:0;
  }

  /* NAV */
  nav {
    position:fixed; top:0; left:0; right:0;
    background:rgba(2,6,8,0.95); border-bottom:1px solid var(--border);
    padding:0 20px; height:56px; display:flex; align-items:center;
    justify-content:space-between; z-index:100; backdrop-filter:blur(10px);
  }
  .nav-logo { font-family:'Share Tech Mono',monospace; font-size:1rem; letter-spacing:3px; user-select:none; }
  .nav-logo .g { color:var(--accent); }
  .nav-logo .v { color:white; }
  .back-btn { background:none; border:1px solid var(--border); color:var(--text-dim); padding:6px 14px; font-family:'Share Tech Mono',monospace; font-size:0.7rem; cursor:pointer; letter-spacing:1px; transition:all 0.2s; }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* LAYOUT */
  main { padding-top:72px; padding-bottom:30px; min-height:100vh; position:relative; z-index:1; }
  .container { padding:20px; max-width:700px; margin:0 auto; }

  /* TOOL HEADER */
  .tool-header { background:var(--bg2); border:1px solid var(--border); border-left:3px solid var(--accent); padding:16px 18px; margin-bottom:20px; animation:fadeIn 0.4s ease; }
  .tool-header .breadcrumb { font-family:'Share Tech Mono',monospace; font-size:0.62rem; color:var(--text-dim); letter-spacing:2px; margin-bottom:6px; }
  .tool-header h1 { font-size:1.2rem; font-weight:700; letter-spacing:2px; color:white; margin-bottom:4px; }
  .tool-header .tool-type-badge { font-family:'Share Tech Mono',monospace; font-size:0.62rem; letter-spacing:2px; color:var(--accent); border:1px solid var(--accent); padding:2px 10px; display:inline-block; }
  .tool-header .tool-desc { font-size:0.82rem; color:var(--text-dim); margin-top:8px; line-height:1.5; }

  /* SECTION */
  .section-title { font-family:'Share Tech Mono',monospace; font-size:0.72rem; color:var(--accent); letter-spacing:3px; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px; }

  /* PARAM FORM */
  .param-form { background:var(--bg2); border:1px solid var(--border); padding:18px; margin-bottom:16px; animation:fadeIn 0.4s ease; }
  .param-group { margin-bottom:14px; }
  .param-label { display:block; font-family:'Share Tech Mono',monospace; font-size:0.65rem; letter-spacing:2px; color:var(--text-dim); margin-bottom:6px; }
  .param-input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:11px 14px; font-family:'Share Tech Mono',monospace; font-size:0.85rem; outline:none; transition:border-color 0.2s; }
  .param-input:focus { border-color:var(--accent); }
  .param-input::placeholder { color:var(--text-dim); }
  select.param-input { cursor:pointer; }

  /* CMD PREVIEW */
  .cmd-preview { background:var(--bg3); border:1px solid var(--border); border-left:3px solid var(--accent2); padding:14px 16px; margin-bottom:16px; font-family:'Share Tech Mono',monospace; font-size:0.78rem; color:var(--accent2); line-height:1.6; word-break:break-all; }
  .cmd-preview .cmd-label { font-size:0.6rem; color:var(--text-dim); letter-spacing:2px; margin-bottom:6px; }

  /* RUN BUTTON */
  .btn-run { width:100%; padding:14px; background:var(--accent); color:var(--bg); border:none; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1rem; letter-spacing:3px; cursor:pointer; transition:all 0.2s; clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%); margin-bottom:16px; }
  .btn-run:hover { background:white; }
  .btn-run:disabled { opacity:0.5; cursor:not-allowed; }

  /* TERMINAL OUTPUT */
  .terminal { background:#000; border:1px solid var(--accent); padding:16px; font-family:'Share Tech Mono',monospace; font-size:0.8rem; line-height:1.8; color:#00ff88; max-height:420px; overflow-y:auto; display:none; animation:fadeIn 0.3s ease; position:relative; }
  .terminal .t-line { margin-bottom:2px; }
  .terminal .t-line.err { color:var(--accent3); }
  .terminal .t-line.sys { color:var(--text-dim); }
  .terminal .t-line.ok  { color:var(--accent); }
  .terminal .t-cursor { display:inline-block; width:8px; height:14px; background:var(--accent); animation:blink 1s infinite; vertical-align:middle; margin-left:2px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .terminal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .terminal-label { font-size:0.65rem; color:var(--text-dim); letter-spacing:2px; }
  .btn-copy { background:none; border:1px solid var(--border); color:var(--text-dim); padding:4px 12px; font-family:'Share Tech Mono',monospace; font-size:0.62rem; cursor:pointer; letter-spacing:1px; transition:all 0.2s; }
  .btn-copy:hover { border-color:var(--accent); color:var(--accent); }

  /* AI CHAT */
  .ai-chat { display:none; animation:fadeIn 0.4s ease; }
  .ai-messages { background:var(--bg2); border:1px solid var(--border); padding:16px; min-height:200px; max-height:380px; overflow-y:auto; margin-bottom:12px; }
  .ai-msg { margin-bottom:14px; }
  .ai-msg .ai-msg-role { font-family:'Share Tech Mono',monospace; font-size:0.6rem; letter-spacing:2px; color:var(--text-dim); margin-bottom:4px; }
  .ai-msg .ai-msg-role.user-role { color:var(--accent2); }
  .ai-msg .ai-msg-role.ai-role  { color:var(--accent); }
  .ai-msg .ai-msg-body { font-size:0.85rem; color:var(--text); line-height:1.6; white-space:pre-wrap; }
  .ai-input-row { display:flex; gap:10px; }
  .ai-input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:11px 14px; font-family:'Share Tech Mono',monospace; font-size:0.82rem; outline:none; transition:border-color 0.2s; resize:none; min-height:48px; max-height:120px; }
  .ai-input:focus { border-color:var(--accent); }
  .ai-input::placeholder { color:var(--text-dim); }
  .btn-send { background:var(--accent); color:var(--bg); border:none; padding:0 20px; font-family:'Share Tech Mono',monospace; font-size:0.75rem; letter-spacing:1px; cursor:pointer; font-weight:700; transition:all 0.2s; white-space:nowrap; }
  .btn-send:hover { background:white; }
  .btn-send:disabled { opacity:0.5; cursor:not-allowed; }
  .ai-thinking { font-family:'Share Tech Mono',monospace; font-size:0.72rem; color:var(--text-dim); letter-spacing:2px; padding:8px 0; display:none; }

  /* DOWNLOAD */
  .download-box { display:none; background:var(--bg2); border:1px solid var(--border); padding:24px; text-align:center; animation:fadeIn 0.4s ease; }
  .download-icon { font-size:2.5rem; margin-bottom:12px; }
  .download-name { font-size:1rem; font-weight:700; letter-spacing:2px; color:white; margin-bottom:6px; }
  .download-info { font-family:'Share Tech Mono',monospace; font-size:0.68rem; color:var(--text-dim); letter-spacing:1px; margin-bottom:20px; }
  .btn-dl { background:var(--accent); color:var(--bg); border:none; padding:12px 32px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1rem; letter-spacing:3px; cursor:pointer; transition:all 0.2s; clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%); }
  .btn-dl:hover { background:white; }

  /* IFRAME SANDBOX */
  .iframe-box { display:none; animation:fadeIn 0.4s ease; }
  .iframe-toolbar { background:var(--bg2); border:1px solid var(--border); border-bottom:none; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; }
  .iframe-url { font-family:'Share Tech Mono',monospace; font-size:0.65rem; color:var(--text-dim); letter-spacing:1px; }
  .iframe-sandbox { width:100%; height:520px; border:1px solid var(--border); background:#000; }
  .iframe-placeholder { width:100%; height:520px; border:1px solid var(--border); background:var(--bg2); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
  .iframe-placeholder p { font-family:'Share Tech Mono',monospace; font-size:0.72rem; color:var(--text-dim); text-align:center; letter-spacing:1px; }
  .btn-open-external { background:none; border:1px solid var(--accent2); color:var(--accent2); padding:8px 20px; font-family:'Share Tech Mono',monospace; font-size:0.7rem; cursor:pointer; letter-spacing:1px; transition:all 0.2s; }
  .btn-open-external:hover { background:rgba(0,168,255,0.1); }

  /* STATUS / LOADING */
  .status-msg { padding:10px 14px; font-family:'Share Tech Mono',monospace; font-size:0.75rem; letter-spacing:1px; margin-bottom:12px; display:none; }
  .status-msg.ok  { border:1px solid var(--accent);  color:var(--accent);  background:rgba(0,245,196,0.05); }
  .status-msg.err { border:1px solid var(--accent3); color:var(--accent3); background:rgba(255,0,60,0.05); }
  .loading { text-align:center; padding:40px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; font-size:0.8rem; letter-spacing:2px; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:8px; }

  @keyframes spin   { to { transform:rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<nav>
  <div class="nav-logo"><span class="g">GENESIS</span><span class="v">VAULT</span></div>
  <button class="back-btn" onclick="goBack()">← BACK</button>
</nav>

<main>
<div class="container" id="container">
  <div class="loading"><span class="spinner"></span>Loading tool...</div>
</div>
</main>

<script>
const API   = 'https://genesis-vault-backend.onrender.com/api';
const token = localStorage.getItem('gv_token');
if (!token) location.href = 'login.html';

const params  = new URLSearchParams(location.search);
const TOOL_ID = params.get('tool_id');
if (!TOOL_ID) { location.href = 'market.html'; }

let tool        = null;
let paramValues = {};
let aiHistory   = [];

function h() { return { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` }; }
async function fetchWithAuth(url, opts={}) {
  opts.headers = { ...h(), ...(opts.headers||{}) };
  const res = await fetch(url, opts);
  if (res.status === 401) { localStorage.removeItem('gv_token'); location.href='login.html'; throw new Error('401'); }
  return res;
}

function goBack() {
  const ref = document.referrer;
  if (ref && (ref.includes('market') || ref.includes('dashboard'))) history.back();
  else location.href = 'market.html';
}

function esc(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── BOOT ── */
async function boot() {
  try {
    const res  = await fetchWithAuth(`${API}/tools/${TOOL_ID}`);
    const data = await res.json();
    tool = data.tool || data;
    if (!tool || !tool.id) throw new Error('Not found');
    renderRunner();
  } catch(e) {
    document.getElementById('container').innerHTML =
      `<div class="loading" style="color:var(--accent3)">// Could not load tool. <br><br><button class="back-btn" style="margin-top:12px" onclick="goBack()">← GO BACK</button></div>`;
  }
}

/* ── RENDER RUNNER ── */
function renderRunner() {
  const rt   = (tool.tool_run_type || '').toLowerCase();
  const type = (tool.type || '').toLowerCase();

  let modeLabel = 'TOOL';
  if      (rt === 'security')   modeLabel = 'SECURITY TOOL';
  else if (rt === 'automation') modeLabel = 'AUTOMATION';
  else if (rt === 'download')   modeLabel = 'DOWNLOAD';
  else if (rt === 'ai')         modeLabel = 'AI TOOL';
  else if (type === 'apps')     modeLabel = 'WEB APP';

  document.getElementById('container').innerHTML = `
    <div class="tool-header">
      <div class="breadcrumb">// VAULT RUNNER</div>
      <h1>${esc(tool.title)}</h1>
      <span class="tool-type-badge">${modeLabel}</span>
      ${tool.description ? `<p class="tool-desc">${esc(tool.description)}</p>` : ''}
    </div>

    <div class="status-msg" id="status-msg"></div>

    <!-- SECURITY / AUTOMATION: param form + terminal -->
    <div id="mode-security" style="display:none">
      <div class="param-form" id="param-form">
        <div class="section-title">// PARAMETERS</div>
        <div id="param-fields"><!-- injected --></div>
      </div>
      <div class="cmd-preview" id="cmd-preview" style="display:none">
        <div class="cmd-label">// COMMAND PREVIEW</div>
        <div id="cmd-text"></div>
      </div>
      <button class="btn-run" id="btn-run" onclick="runTool()">[ RUN TOOL ]</button>
      <div class="terminal" id="terminal">
        <div class="terminal-header">
          <span class="terminal-label">// OUTPUT</span>
          <button class="btn-copy" onclick="copyOutput()">COPY</button>
        </div>
        <div id="terminal-lines"></div>
      </div>
    </div>

    <!-- AI TOOL: chat interface -->
    <div id="mode-ai" class="ai-chat">
      <div class="section-title">// AI TERMINAL — ${esc(tool.title)}</div>
      <div class="ai-messages" id="ai-messages">
        <div class="ai-msg">
          <div class="ai-msg-role ai-role">// SYSTEM</div>
          <div class="ai-msg-body" style="color:var(--text-dim);font-size:0.78rem;">${esc(tool.input_label || 'Enter your query below.')}</div>
        </div>
      </div>
      <div class="ai-thinking" id="ai-thinking"><span class="spinner"></span>// Processing...</div>
      <div class="ai-input-row">
        <textarea class="ai-input" id="ai-input" placeholder="// Enter your query..." rows="2" onkeydown="aiKeyDown(event)"></textarea>
        <button class="btn-send" id="btn-send" onclick="sendAI()">[ SEND ]</button>
      </div>
    </div>

    <!-- DOWNLOAD -->
    <div id="mode-download" class="download-box">
      <div class="download-icon">⬇</div>
      <div class="download-name">${esc(tool.title)}</div>
      <div class="download-info">// ${esc((tool.file_type||'FILE').toUpperCase())} · ${esc((tool.delivery||'DIRECT').toUpperCase())} DELIVERY</div>
      <button class="btn-dl" id="btn-dl" onclick="doDownload()">[ DOWNLOAD FILE ]</button>
    </div>

    <!-- APP / IFRAME -->
    <div id="mode-app" class="iframe-box">
      <div class="section-title">// RUNNING IN VAULT LABS</div>
      <div id="iframe-container"><!-- injected --></div>
    </div>
  `;

  // Dispatch to correct mode
  if (rt === 'security' || rt === 'automation') {
    initSecurityMode();
  } else if (rt === 'ai') {
    initAIMode();
  } else if (rt === 'download' || type === 'scripts' || type === 'templates') {
    initDownloadMode();
  } else if (type === 'apps' || tool.content_url) {
    initAppMode();
  } else {
    // Fallback: show all available options
    initFallback();
  }
}

/* ── SECURITY / AUTOMATION MODE ── */
function initSecurityMode() {
  document.getElementById('mode-security').style.display = 'block';
  const fields = document.getElementById('param-fields');
  let schema = [];
  try { schema = typeof tool.params_schema === 'string' ? JSON.parse(tool.params_schema) : (tool.params_schema || []); } catch(e){}

  if (!schema.length) {
    // No params needed — just show run button with command
    fields.innerHTML = `<p style="font-family:'Share Tech Mono',monospace;font-size:0.72rem;color:var(--text-dim);">// No parameters required. Press RUN to execute.</p>`;
    updateCmdPreview();
    return;
  }

  fields.innerHTML = schema.map(f => `
    <div class="param-group">
      <label class="param-label">${esc(f.label || f.name)} ${f.required !== false ? '<span style="color:var(--accent3)">*</span>' : ''}</label>
      ${f.type === 'select'
        ? `<select class="param-input" id="param-${esc(f.name)}" onchange="updateCmdPreview()">
             ${(f.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
           </select>`
        : `<input class="param-input" type="${f.type==='number'?'number':'text'}" id="param-${esc(f.name)}"
             placeholder="${esc(f.placeholder||'')}" oninput="updateCmdPreview()">`
      }
    </div>`).join('');

  updateCmdPreview();
}

function getParamValues() {
  let schema = [];
  try { schema = typeof tool.params_schema === 'string' ? JSON.parse(tool.params_schema) : (tool.params_schema || []); } catch(e){}
  const vals = {};
  schema.forEach(f => {
    const el = document.getElementById(`param-${f.name}`);
    if (el) vals[f.name] = el.value.trim();
  });
  return vals;
}

function updateCmdPreview() {
  const preview = document.getElementById('cmd-preview');
  const cmdText = document.getElementById('cmd-text');
  if (!tool.command_template) return;
  const vals = getParamValues();
  let cmd = tool.command_template;
  Object.entries(vals).forEach(([k,v]) => { cmd = cmd.replace(new RegExp(`\\{${k}\\}`,'g'), v || `{${k}}`); });
  cmdText.textContent = '$ ' + cmd;
  preview.style.display = 'block';
}

async function runTool() {
  const btn  = document.getElementById('btn-run');
  const term = document.getElementById('terminal');
  const lines = document.getElementById('terminal-lines');
  const msg  = document.getElementById('status-msg');

  // Validate required params
  let schema = [];
  try { schema = typeof tool.params_schema === 'string' ? JSON.parse(tool.params_schema) : (tool.params_schema || []); } catch(e){}
  const vals = getParamValues();
  for (const f of schema) {
    if (f.required !== false && !vals[f.name]) {
      showStatus(msg, `// Required: ${f.label || f.name}`, true); return;
    }
  }
  msg.style.display = 'none';

  btn.disabled = true; btn.textContent = '[ RUNNING... ]';
  term.style.display = 'block';
  lines.innerHTML = '';
  addLine('// Initializing tool runner...', 'sys');
  addLine(`// Tool: ${tool.title}`, 'sys');
  addLine(`// Run type: ${tool.tool_run_type}`, 'sys');
  addLine('', 'sys');

  try {
    const body = { tool_id: tool.id, params: vals };
    const res = await fetchWithAuth(`${API}/tools/${tool.id}/run`, {
      method:'POST', body: JSON.stringify(body)
    });
    const data = await res.json();

    if (data.output) {
      data.output.split('\n').forEach(line => addLine(line, ''));
    } else if (data.result) {
      String(data.result).split('\n').forEach(line => addLine(line, ''));
    } else if (data.error) {
      addLine('// ERROR: ' + data.error, 'err');
    } else if (data.status === 'queued' || data.status === 'pending') {
      addLine('// Tool queued for execution.', 'ok');
      addLine(`// Job ID: ${data.job_id || data.id || 'N/A'}`, 'sys');
      addLine('// Check back shortly for results.', 'sys');
      if (data.estimated_time) addLine(`// Estimated time: ${data.estimated_time}`, 'sys');
    } else {
      addLine(JSON.stringify(data, null, 2), '');
    }
    addLine('', 'sys');
    addLine('// Execution complete.', 'ok');
  } catch(e) {
    addLine('// Network error — could not reach execution server.', 'err');
    addLine(`// ${e.message}`, 'err');
  }

  btn.disabled = false; btn.textContent = '[ RUN AGAIN ]';
  term.scrollTop = term.scrollHeight;
}

function addLine(text, cls) {
  const lines = document.getElementById('terminal-lines');
  const div = document.createElement('div');
  div.className = 't-line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  lines.appendChild(div);
}

function copyOutput() {
  const text = document.getElementById('terminal-lines').innerText;
  navigator.clipboard.writeText(text).then(()=>toast('// Output copied.'));
}

/* ── AI MODE ── */
function initAIMode() {
  document.getElementById('mode-ai').style.display = 'block';
}

function aiKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAI(); }
}

async function sendAI() {
  const input  = document.getElementById('ai-input');
  const btn    = document.getElementById('btn-send');
  const think  = document.getElementById('ai-thinking');
  const msgs   = document.getElementById('ai-messages');
  const userMsg = input.value.trim();
  if (!userMsg) return;

  input.value = '';
  btn.disabled = true;
  think.style.display = 'block';

  // Add user message
  appendAIMsg('// YOU', userMsg, 'user-role');
  aiHistory.push({ role:'user', content: userMsg });

  try {
    const res = await fetchWithAuth(`${API}/tools/${tool.id}/ai-run`, {
      method:'POST',
      body: JSON.stringify({ message: userMsg, history: aiHistory.slice(-10) })
    });
    const data = await res.json();
    const reply = data.reply || data.output || data.message || '// No response.';
    appendAIMsg('// AI', reply, 'ai-role');
    aiHistory.push({ role:'assistant', content: reply });
  } catch(e) {
    appendAIMsg('// ERROR', 'Network error — could not reach AI.', 'ai-role');
  }

  think.style.display = 'none';
  btn.disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}

function appendAIMsg(role, body, roleClass) {
  const msgs = document.getElementById('ai-messages');
  const div  = document.createElement('div');
  div.className = 'ai-msg';
  div.innerHTML = `<div class="ai-msg-role ${roleClass}">${esc(role)}</div><div class="ai-msg-body">${esc(body)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

/* ── DOWNLOAD MODE ── */
function initDownloadMode() {
  document.getElementById('mode-download').style.display = 'block';
}

function doDownload() {
  if (tool.download_url) {
    window.open(tool.download_url, '_blank');
  } else {
    toast('// Download link not available yet. Contact admin.');
  }
}

/* ── APP / IFRAME MODE ── */
function initAppMode() {
  document.getElementById('mode-app').style.display = 'block';
  const container = document.getElementById('iframe-container');
  if (tool.content_url) {
    container.innerHTML = `
      <div class="iframe-toolbar">
        <span class="iframe-url">// ${esc(tool.content_url)}</span>
        <button class="btn-copy" onclick="window.open('${esc(tool.content_url)}','_blank')">OPEN FULL</button>
      </div>
      <iframe class="iframe-sandbox"
        src="${esc(tool.content_url)}"
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
        loading="lazy"
        title="${esc(tool.title)}">
      </iframe>`;
  } else {
    container.innerHTML = `
      <div class="iframe-placeholder">
        <p>// App content URL not configured yet.</p>
        <p>// Admin needs to set the content_url for this tool.</p>
      </div>`;
  }
}

/* ── FALLBACK ── */
function initFallback() {
  const msg = document.getElementById('status-msg');
  showStatus(msg, '// Tool configuration incomplete. Contact admin to set run type.', true);
  document.getElementById('mode-security').style.display = 'block';
  document.getElementById('param-fields').innerHTML =
    `<p style="font-family:'Share Tech Mono',monospace;font-size:0.72rem;color:var(--text-dim);">// Awaiting tool configuration.</p>`;
  document.getElementById('btn-run').style.display = 'none';
}

/* ── UTILS ── */
function showStatus(el, msg, err) {
  el.textContent = msg;
  el.className   = 'status-msg ' + (err ? 'err' : 'ok');
  el.style.display = 'block';
}
function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style,{position:'fixed',bottom:'30px',left:'50%',transform:'translateX(-50%)',background:'var(--bg2)',border:'1px solid var(--accent)',color:'var(--accent)',padding:'8px 20px',fontFamily:"'Share Tech Mono',monospace",fontSize:'0.75rem',letterSpacing:'1px',zIndex:'999',pointerEvents:'none',whiteSpace:'nowrap'});
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

boot();
</script>
</body>
</html>
