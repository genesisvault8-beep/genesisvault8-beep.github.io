<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IP LOCATOR // GENESIS VAULT</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --red: #ff2244;
    --green: #00ffaa;
    --bg: #0a0c0f;
    --surface: #0f1318;
    --border: #1e2530;
    --text: #c8d4e0;
    --dim: #4a5a6a;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    padding: 20px 16px 40px;
    background-image:
      linear-gradient(rgba(0,255,170,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,170,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }
  .logo { font-family: var(--sans); font-weight: 700; font-size: 13px; letter-spacing: 3px; }
  .logo span { color: var(--red); }
  .tag { font-size: 10px; color: var(--dim); letter-spacing: 2px; margin-top: 2px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .search-section { margin-bottom: 24px; }
  label { font-size: 11px; letter-spacing: 2px; color: var(--dim); display: block; margin-bottom: 8px; }
  .input-row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--green); box-shadow: 0 0 0 1px rgba(0,255,170,0.15); }
  input[type="text"]::placeholder { color: var(--dim); }

  button {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  button:hover { background: var(--red); color: #fff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .error {
    color: var(--red);
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 1px;
    display: none;
  }

  .results { display: none; }

  .section-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 100%;
    background: var(--green);
    opacity: 0.5;
  }
  .card.wide { grid-column: span 2; }
  .card-label { font-size: 9px; letter-spacing: 2px; color: var(--dim); margin-bottom: 4px; }
  .card-value { font-size: 14px; color: var(--green); word-break: break-all; }
  .card-value.large { font-size: 18px; color: #fff; }

  .map-container {
    border: 1px solid var(--border);
    height: 220px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .map-container iframe {
    width: 100%; height: 100%;
    border: none;
    filter: invert(90%) hue-rotate(180deg) saturate(0.7);
  }
  .map-overlay {
    position: absolute;
    bottom: 8px; right: 8px;
    background: rgba(10,12,15,0.85);
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-size: 10px;
    color: var(--dim);
    pointer-events: none;
  }

  .loading {
    text-align: center;
    padding: 40px 0;
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 3px;
    display: none;
  }
  .loading span { color: var(--green); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0} }

  .scan-line {
    position: fixed; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: scan 4s linear infinite;
    opacity: 0.3;
    pointer-events: none;
  }
  @keyframes scan { 0%{top:0} 100%{top:100vh} }
</style>
</head>
<body>
<div class="scan-line"></div>

<header>
  <div>
    <div class="logo"><span>GENESIS</span>VAULT</div>
    <div class="tag">// IP LOCATOR TERMINAL</div>
  </div>
  <div class="status-dot"></div>
</header>

<div class="search-section">
  <label>TARGET IP ADDRESS</label>
  <div class="input-row">
    <input type="text" id="ipInput" placeholder="e.g. 8.8.8.8" autocomplete="off" spellcheck="false"/>
    <button id="lookupBtn" onclick="lookup()">TRACE</button>
  </div>
  <div class="error" id="errorMsg">// INVALID IP ADDRESS OR LOOKUP FAILED</div>
</div>

<div class="loading" id="loading">SCANNING<span>_</span></div>

<div class="results" id="results">

  <div class="section-title">IDENTITY</div>
  <div class="grid">
    <div class="card wide">
      <div class="card-label">IP ADDRESS</div>
      <div class="card-value large" id="r-ip">—</div>
    </div>
    <div class="card">
      <div class="card-label">HOSTNAME</div>
      <div class="card-value" id="r-hostname">—</div>
    </div>
    <div class="card">
      <div class="card-label">ISP / ORG</div>
      <div class="card-value" id="r-isp">—</div>
    </div>
    <div class="card">
      <div class="card-label">ASN</div>
      <div class="card-value" id="r-asn">—</div>
    </div>
    <div class="card">
      <div class="card-label">TYPE</div>
      <div class="card-value" id="r-type">—</div>
    </div>
  </div>

  <div class="section-title">LOCATION</div>
  <div class="grid">
    <div class="card">
      <div class="card-label">COUNTRY</div>
      <div class="card-value" id="r-country">—</div>
    </div>
    <div class="card">
      <div class="card-label">REGION</div>
      <div class="card-value" id="r-region">—</div>
    </div>
    <div class="card">
      <div class="card-label">CITY</div>
      <div class="card-value" id="r-city">—</div>
    </div>
    <div class="card">
      <div class="card-label">POSTAL CODE</div>
      <div class="card-value" id="r-postal">—</div>
    </div>
    <div class="card">
      <div class="card-label">LATITUDE</div>
      <div class="card-value" id="r-lat">—</div>
    </div>
    <div class="card">
      <div class="card-label">LONGITUDE</div>
      <div class="card-value" id="r-lon">—</div>
    </div>
    <div class="card wide">
      <div class="card-label">TIMEZONE</div>
      <div class="card-value" id="r-tz">—</div>
    </div>
  </div>

  <div class="section-title">MAP</div>
  <div class="map-container">
    <iframe id="mapFrame" src=""></iframe>
    <div class="map-overlay" id="mapCoords">—</div>
  </div>

</div>

<script>
async function lookup() {
  const input = document.getElementById('ipInput').value.trim();
  const err = document.getElementById('errorMsg');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  const btn = document.getElementById('lookupBtn');

  err.style.display = 'none';
  results.style.display = 'none';

  if (!input) { err.style.display = 'block'; err.textContent = '// ENTER AN IP ADDRESS'; return; }

  btn.disabled = true;
  loading.style.display = 'block';

  try {
    const res = await fetch(`https://ipwho.is/${encodeURIComponent(input)}`);
    const d = await res.json();

    if (!d.success) throw new Error(d.message || 'Lookup failed');

    document.getElementById('r-ip').textContent = d.ip || '—';
    document.getElementById('r-hostname').textContent = d.hostname || '—';
    document.getElementById('r-isp').textContent = d.connection?.isp || d.org || '—';
    document.getElementById('r-asn').textContent = d.connection?.asn ? `AS${d.connection.asn}` : '—';
    document.getElementById('r-type').textContent = d.type || '—';
    document.getElementById('r-country').textContent = d.country ? `${d.flag?.emoji || ''} ${d.country}` : '—';
    document.getElementById('r-region').textContent = d.region || '—';
    document.getElementById('r-city').textContent = d.city || '—';
    document.getElementById('r-postal').textContent = d.postal || '—';
    document.getElementById('r-lat').textContent = d.latitude ?? '—';
    document.getElementById('r-lon').textContent = d.longitude ?? '—';
    document.getElementById('r-tz').textContent = d.timezone?.id || '—';

    if (d.latitude && d.longitude) {
      const lat = d.latitude, lon = d.longitude;
      document.getElementById('mapFrame').src =
        `https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.5},${lat-0.5},${lon+0.5},${lat+0.5}&layer=mapnik&marker=${lat},${lon}`;
      document.getElementById('mapCoords').textContent = `${lat}, ${lon}`;
    }

    loading.style.display = 'none';
    results.style.display = 'block';
  } catch(e) {
    loading.style.display = 'none';
    err.textContent = `// ERROR: ${e.message.toUpperCase()}`;
    err.style.display = 'block';
  }

  btn.disabled = false;
}

document.getElementById('ipInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookup();
});
</script>
</body>
</html>
