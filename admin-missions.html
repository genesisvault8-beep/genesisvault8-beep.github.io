<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mission Control — Genesis Vault Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #020608;
      --bg2:     #060d10;
      --bg3:     #0a1520;
      --accent:  #00f5c4;
      --accent2: #00a8ff;
      --accent3: #ff003c;
      --gold:    #f5a623;
      --text:    #c8e6f0;
      --dim:     #4a7a8a;
      --border:  #0f2a35;
      --green:   #00e676;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(255,0,60,0.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,0,60,0.015) 1px,transparent 1px);
      background-size:40px 40px; pointer-events:none; z-index:0;
    }

    nav {
      position:sticky; top:0; z-index:100; background:rgba(2,6,8,0.96);
      border-bottom:1px solid rgba(255,0,60,0.2); padding:0 20px; height:56px;
      display:flex; align-items:center; justify-content:space-between; backdrop-filter:blur(10px);
    }
    .nav-logo { font-family:'Share Tech Mono',monospace; font-size:0.9rem; letter-spacing:4px; color:var(--accent3); text-decoration:none; }
    .nav-logo span { color:white; }
    .admin-badge { font-family:'Share Tech Mono',monospace; font-size:0.6rem; letter-spacing:2px; color:var(--accent3); border:1px solid rgba(255,0,60,0.3); padding:3px 8px; }
    .back-btn { font-family:'Share Tech Mono',monospace; font-size:0.62rem; color:var(--dim); text-decoration:none; letter-spacing:1px; }
    .back-btn:hover { color:var(--accent); }

    .hero { position:relative; z-index:1; padding:24px 20px 14px; }
    .hero-eyebrow { font-family:'Share Tech Mono',monospace; font-size:0.62rem; letter-spacing:3px; color:var(--accent3); margin-bottom:6px; }
    .hero h1 { font-size:clamp(20px,4vw,30px); font-weight:700; letter-spacing:3px; color:white; }
    .hero h1 span { color:var(--accent3); }

    .stats-bar { position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr 1fr 1fr; margin:14px 20px 0; border:1px solid rgba(255,0,60,0.2); background:var(--bg2); }
    .stat-item { padding:10px 6px; text-align:center; border-right:1px solid rgba(255,0,60,0.15); }
    .stat-item:last-child { border-right:none; }
    .stat-val { font-family:'Share Tech Mono',monospace; font-size:1.1rem; color:var(--accent3); display:block; }
    .stat-lbl { font-size:0.52rem; color:var(--dim); letter-spacing:1px; text-transform:uppercase; margin-top:2px; }

    /* TABS */
    .tab-row { display:flex; border-bottom:1px solid var(--border); position:relative; z-index:1; margin:14px 20px 0; }
    .tab-btn { flex:1; padding:10px; font-family:'Share Tech Mono',monospace; font-size:0.62rem; letter-spacing:2px; text-transform:uppercase; background:none; border:none; color:var(--dim); cursor:pointer; transition:all 0.2s; border-bottom:2px solid transparent; }
    .tab-btn.active { color:var(--accent3); border-bottom-color:var(--accent3); }

    .section { position:relative; z-index:1; padding:20px 20px 0; }
    .section-title { font-family:'Share Tech Mono',monospace; font-size:0.68rem; color:var(--accent3); letter-spacing:3px; text-transform:uppercase; border-bottom:1px solid rgba(255,0,60,0.2); padding-bottom:8px; margin-bottom:14px; }

    /* POST MISSION FORM */
    .form-card { background:var(--bg2); border:1px solid rgba(255,0,60,0.2); padding:16px; margin-bottom:16px; }
    .field-label { font-family:'Share Tech Mono',monospace; font-size:0.62rem; color:var(--accent); letter-spacing:2px; margin-bottom:6px; display:block; }
    .field-input {
      width:100%; padding:10px 12px; background:var(--bg3); border:1px solid var(--border);
      color:var(--text); font-family:'Share Tech Mono',monospace; font-size:0.75rem;
      margin-bottom:12px; transition:border-color 0.2s; resize:vertical;
    }
    .field-input:focus { outline:none; border-color:var(--accent3); }
    .field-input::placeholder { color:var(--dim); }

    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    select.field-input { cursor:pointer; }

    .post-btn {
      width:100%; padding:13px; border:none; font-family:'Share Tech Mono',monospace;
      font-size:0.8rem; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all 0.2s;
      background:var(--accent3); color:white;
      clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
    }
    .post-btn:hover { background:white; color:var(--bg); }
    .post-btn:disabled { background:var(--border); color:var(--dim); cursor:not-allowed; clip-path:none; }

    /* MISSIONS LIST */
    .admin-mission-card { background:var(--bg2); border:1px solid var(--border); margin-bottom:10px; }
    .admin-mission-card.active-card  { border-left:3px solid var(--green); }
    .admin-mission-card.paused-card  { border-left:3px solid var(--gold); }
    .admin-mission-card.closed-card  { border-left:3px solid var(--dim); }

    .amc-body { padding:12px 14px; }
    .amc-top  { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
    .amc-name { font-size:0.95rem; font-weight:700; color:white; letter-spacing:1px; }
    .amc-vc   { font-family:'Share Tech Mono',monospace; font-size:1rem; color:var(--gold); }
    .amc-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
    .amc-badge { font-family:'Share Tech Mono',monospace; font-size:0.52rem; padding:2px 7px; border:1px solid var(--border); color:var(--dim); }
    .amc-desc { font-size:0.72rem; color:var(--dim); line-height:1.4; }
    .amc-footer { padding:0 14px 12px; display:flex; gap:8px; flex-wrap:wrap; }
    .amc-btn { padding:7px 12px; border:1px solid var(--border); background:none; font-family:'Share Tech Mono',monospace; font-size:0.6rem; letter-spacing:1px; cursor:pointer; transition:all 0.2s; color:var(--dim); }
    .amc-btn:hover { border-color:var(--accent); color:var(--accent); }
    .amc-btn.danger:hover { border-color:var(--accent3); color:var(--accent3); }
    .amc-btn.green-btn { border-color:rgba(0,230,118,0.3); color:var(--green); }

    /* SUBMISSIONS */
    .sub-card { background:var(--bg2); border:1px solid var(--border); margin-bottom:10px; }
    .sub-card.pending-card  { border-left:3px solid var(--gold); }
    .sub-card.approved-card { border-left:3px solid var(--green); }
    .sub-card.rejected-card { border-left:3px solid var(--accent3); }

    .sub-body { padding:12px 14px; }
    .sub-top  { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
    .sub-user { font-size:0.85rem; font-weight:700; color:white; letter-spacing:1px; }
    .sub-status-badge { font-family:'Share Tech Mono',monospace; font-size:0.55rem; padding:2px 8px; }
    .sub-status-badge.pending  { color:var(--gold);    border:1px solid rgba(245,166,35,0.3); }
    .sub-status-badge.approved { color:var(--green);   border:1px solid rgba(0,230,118,0.3); }
    .sub-status-badge.rejected { color:var(--accent3); border:1px solid rgba(255,0,60,0.3); }

    .sub-mission { font-family:'Share Tech Mono',monospace; font-size:0.6rem; color:var(--accent); margin-bottom:6px; }
    .sub-proof   { font-size:0.75rem; color:var(--dim); word-break:break-all; margin-bottom:4px; }
    .sub-notes   { font-size:0.72rem; color:var(--dim); font-style:italic; }
    .sub-vc      { font-family:'Share Tech Mono',monospace; font-size:0.7rem; color:var(--gold); }
    .sub-footer  { padding:0 14px 12px; display:flex; gap:8px; }
    .approve-btn { flex:1; padding:9px; border:none; font-family:'Share Tech Mono',monospace; font-size:0.65rem; font-weight:700; letter-spacing:2px; cursor:pointer; background:rgba(0,230,118,0.15); color:var(--green); border:1px solid rgba(0,230,118,0.3); transition:all 0.2s; }
    .approve-btn:hover { background:var(--green); color:var(--bg); }
    .reject-btn  { flex:1; padding:9px; border:none; font-family:'Share Tech Mono',monospace; font-size:0.65rem; font-weight:700; letter-spacing:2px; cursor:pointer; background:rgba(255,0,60,0.08); color:var(--accent3); border:1px solid rgba(255,0,60,0.2); transition:all 0.2s; }
    .reject-btn:hover { background:var(--accent3); color:white; }

    /* FILTERS */
    .filter-row { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px; }
    .filter-row::-webkit-scrollbar { display:none; }
    .filter-btn { font-family:'Share Tech Mono',monospace; font-size:0.6rem; letter-spacing:1px; padding:5px 10px; border:1px solid var(--border); background:var(--bg2); color:var(--dim); cursor:pointer; white-space:nowrap; transition:all 0.2s; flex-shrink:0; }
    .filter-btn.active { border-color:var(--accent3); color:var(--accent3); }

    .loading-wrap { text-align:center; padding:30px; }
    .loading-text { font-family:'Share Tech Mono',monospace; font-size:0.72rem; color:var(--dim); letter-spacing:2px; animation:blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .empty-wrap { text-align:center; padding:30px; border:1px solid var(--border); background:var(--bg2); margin-bottom:12px; }
    .empty-text { font-family:'Share Tech Mono',monospace; font-size:0.7rem; color:var(--dim); letter-spacing:1px; }

    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--bg2); border:1px solid var(--accent3); color:var(--accent3); padding:10px 20px; font-family:'Share Tech Mono',monospace; font-size:0.72rem; letter-spacing:1px; z-index:300; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; }
    .toast.show  { transform:translateX(-50%) translateY(0); }
    .toast.ok    { color:var(--green); border-color:var(--green); }

    .bottom-pad { height:40px; }
  </style>
</head>
<body>

<nav>
  <a href="dashboard.html" class="nav-logo">GENESIS<span>VAULT</span></a>
  <span class="admin-badge">ADMIN</span>
  <a href="dashboard.html" class="back-btn">← DASHBOARD</a>
</nav>

<div class="hero">
  <div class="hero-eyebrow">// MISSION CONTROL</div>
  <h1>BOUNTY <span>ADMIN</span></h1>
</div>

<div class="stats-bar">
  <div class="stat-item"><span class="stat-val" id="statTotal">0</span><span class="stat-lbl">Missions</span></div>
  <div class="stat-item"><span class="stat-val" id="statPending">0</span><span class="stat-lbl">Pending</span></div>
  <div class="stat-item"><span class="stat-val" id="statApproved">0</span><span class="stat-lbl">Approved</span></div>
  <div class="stat-item"><span class="stat-val" id="statVCPaid">0</span><span class="stat-lbl">VC Paid</span></div>
</div>

<!-- TABS -->
<div class="tab-row">
  <button class="tab-btn active" onclick="switchTab('post')">POST MISSION</button>
  <button class="tab-btn" onclick="switchTab('manage')">MANAGE</button>
  <button class="tab-btn" onclick="switchTab('review')">REVIEW <span id="pendingBadge"></span></button>
</div>

<!-- POST MISSION TAB -->
<div id="tabPost">
  <div class="section">
    <div class="section-title">// CREATE NEW MISSION</div>
    <div class="form-card">
      <label class="field-label">Mission Title</label>
      <input class="field-input" id="fTitle" type="text" placeholder="e.g. Find 5 subdomains for target.com"/>

      <label class="field-label">Description — Be specific about what proof is required</label>
      <textarea class="field-input" id="fDesc" rows="4" placeholder="e.g. Use subfinder or any tool to find active subdomains for example.com. Submit a text file or screenshot showing at least 5 unique subdomains with HTTP status codes."></textarea>

      <div class="field-row">
        <div>
          <label class="field-label">VC Reward</label>
          <input class="field-input" id="fVC" type="number" placeholder="e.g. 500" min="10" max="50000"/>
        </div>
        <div>
          <label class="field-label">Max Submissions</label>
          <input class="field-input" id="fSlots" type="number" placeholder="e.g. 10" min="1" max="1000"/>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label class="field-label">Difficulty</label>
          <select class="field-input" id="fDiff">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div>
          <label class="field-label">Category</label>
          <select class="field-input" id="fCat">
            <option value="social">Social</option>
            <option value="recon" selected>Recon</option>
            <option value="content">Content</option>
            <option value="testing">Testing</option>
            <option value="general">General</option>
          </select>
        </div>
      </div>

      <label class="field-label">Deadline (optional)</label>
      <input class="field-input" id="fDeadline" type="date"/>

      <button class="post-btn" id="postBtn" onclick="postMission()">▶ POST MISSION</button>
    </div>
  </div>
</div>

<!-- MANAGE MISSIONS TAB -->
<div id="tabManage" style="display:none;">
  <div class="section">
    <div class="section-title">// ALL MISSIONS</div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setMissionFilter('all',this)">ALL</button>
      <button class="filter-btn" onclick="setMissionFilter('active',this)">ACTIVE</button>
      <button class="filter-btn" onclick="setMissionFilter('paused',this)">PAUSED</button>
      <button class="filter-btn" onclick="setMissionFilter('closed',this)">CLOSED</button>
    </div>
    <div id="manageMissionsContainer">
      <div class="loading-wrap"><div class="loading-text">// LOADING...</div></div>
    </div>
  </div>
</div>

<!-- REVIEW SUBMISSIONS TAB -->
<div id="tabReview" style="display:none;">
  <div class="section">
    <div class="section-title">// SUBMISSIONS FOR REVIEW</div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setSubFilter('pending',this)">PENDING</button>
      <button class="filter-btn" onclick="setSubFilter('approved',this)">APPROVED</button>
      <button class="filter-btn" onclick="setSubFilter('rejected',this)">REJECTED</button>
      <button class="filter-btn" onclick="setSubFilter('all',this)">ALL</button>
    </div>
    <div id="reviewContainer">
      <div class="loading-wrap"><div class="loading-text">// LOADING...</div></div>
    </div>
  </div>
</div>

<div class="bottom-pad"></div>
<div class="toast" id="toast"></div>

<script>
  const BACKEND = 'https://youngbill44.pythonanywhere.com';
  const token   = localStorage.getItem('gv_token');
  if (!token) location.href = 'login.html';

  let allMissions    = [];
  let allSubmissions = [];
  let missionFilter  = 'all';
  let subFilter      = 'pending';

  async function init() {
    await Promise.all([loadMissions(), loadSubmissions()]);
  }

  async function loadMissions() {
    try {
      const r = await fetch(`${BACKEND}/api/missions/admin/all`, { headers: h() });
      const d = await r.json();
      allMissions = d.missions || [];
      document.getElementById('statTotal').textContent = allMissions.length;
      renderManageMissions();
    } catch(e) { showToast('Failed to load missions'); }
  }

  async function loadSubmissions() {
    try {
      const r = await fetch(`${BACKEND}/api/missions/admin/submissions`, { headers: h() });
      const d = await r.json();
      allSubmissions = d.submissions || [];

      const pending  = allSubmissions.filter(s => s.status === 'pending').length;
      const approved = allSubmissions.filter(s => s.status === 'approved').length;
      const vcPaid   = allSubmissions.filter(s => s.status === 'approved').reduce((a,s) => a + (s.vc_reward||0), 0);

      document.getElementById('statPending').textContent  = pending;
      document.getElementById('statApproved').textContent = approved;
      document.getElementById('statVCPaid').textContent   = vcPaid.toLocaleString();
      document.getElementById('pendingBadge').textContent = pending > 0 ? ` (${pending})` : '';

      renderReview();
    } catch(e) { showToast('Failed to load submissions'); }
  }

  // ── POST MISSION ──
  async function postMission() {
    const title    = document.getElementById('fTitle').value.trim();
    const desc     = document.getElementById('fDesc').value.trim();
    const vc       = parseInt(document.getElementById('fVC').value);
    const slots    = parseInt(document.getElementById('fSlots').value);
    const diff     = document.getElementById('fDiff').value;
    const cat      = document.getElementById('fCat').value;
    const deadline = document.getElementById('fDeadline').value;

    if (!title)        { showToast('⚠️ Title required'); return; }
    if (!desc)         { showToast('⚠️ Description required'); return; }
    if (!vc || vc < 1) { showToast('⚠️ VC reward required'); return; }
    if (!slots)        { showToast('⚠️ Max submissions required'); return; }

    const btn = document.getElementById('postBtn');
    btn.disabled    = true;
    btn.textContent = '// POSTING...';

    try {
      const r = await fetch(`${BACKEND}/api/missions/create`, {
        method: 'POST',
        headers: h(),
        body: JSON.stringify({ title, description: desc, vc_reward: vc, max_slots: slots, difficulty: diff, category: cat, deadline: deadline || null })
      });
      const d = await r.json();

      if (d.status === 'success') {
        showToast('✅ Mission posted!', true);
        ['fTitle','fDesc','fVC','fSlots','fDeadline'].forEach(id => document.getElementById(id).value = '');
        await loadMissions();
        switchTab('manage');
      } else {
        showToast(d.message || 'Failed to post');
      }
    } catch(e) { showToast('// CONNECTION ERROR'); }

    btn.disabled    = false;
    btn.textContent = '▶ POST MISSION';
  }

  // ── RENDER MANAGE ──
  function renderManageMissions() {
    const filtered = allMissions.filter(m => missionFilter === 'all' || m.status === missionFilter);
    if (!filtered.length) {
      document.getElementById('manageMissionsContainer').innerHTML = `<div class="empty-wrap"><div class="empty-text">// NO MISSIONS</div></div>`;
      return;
    }
    document.getElementById('manageMissionsContainer').innerHTML = filtered.map(m => {
      const slotsLeft = (m.max_slots||0) - (m.slots_used||0);
      return `
        <div class="admin-mission-card ${m.status}-card">
          <div class="amc-body">
            <div class="amc-top">
              <div class="amc-name">${m.title}</div>
              <div class="amc-vc">⬡ ${(m.vc_reward||0).toLocaleString()}</div>
            </div>
            <div class="amc-meta">
              <span class="amc-badge">${(m.difficulty||'').toUpperCase()}</span>
              <span class="amc-badge">${(m.category||'').toUpperCase()}</span>
              <span class="amc-badge">${m.status?.toUpperCase()}</span>
              <span class="amc-badge">${slotsLeft}/${m.max_slots} slots</span>
            </div>
            <div class="amc-desc">${m.description}</div>
          </div>
          <div class="amc-footer">
            ${m.status === 'active'
              ? `<button class="amc-btn" onclick="toggleMission('${m.id}','paused')">⏸ PAUSE</button>`
              : `<button class="amc-btn green-btn" onclick="toggleMission('${m.id}','active')">▶ ACTIVATE</button>`
            }
            <button class="amc-btn danger" onclick="toggleMission('${m.id}','closed')">✕ CLOSE</button>
          </div>
        </div>`;
    }).join('');
  }

  // ── RENDER REVIEW ──
  function renderReview() {
    const filtered = allSubmissions.filter(s => subFilter === 'all' || s.status === subFilter);
    if (!filtered.length) {
      document.getElementById('reviewContainer').innerHTML = `<div class="empty-wrap"><div class="empty-text">// NO ${subFilter.toUpperCase()} SUBMISSIONS</div></div>`;
      return;
    }
    document.getElementById('reviewContainer').innerHTML = filtered.map(s => {
      const mission = allMissions.find(m => m.id === s.mission_id);
      const date    = new Date(s.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      const isPending = s.status === 'pending';
      return `
        <div class="sub-card ${s.status}-card">
          <div class="sub-body">
            <div class="sub-top">
              <div class="sub-user">👤 ${s.username || s.user_id?.slice(0,8) || 'Unknown'}</div>
              <span class="sub-status-badge ${s.status}">${s.status.toUpperCase()}</span>
            </div>
            <div class="sub-mission">📋 ${mission ? mission.title : 'Mission #'+s.mission_id}</div>
            <div class="sub-proof">📎 <a href="${s.proof_url}" target="_blank" style="color:var(--accent2)">${s.proof_url}</a></div>
            ${s.proof_notes ? `<div class="sub-notes">💬 "${s.proof_notes}"</div>` : ''}
            <div style="display:flex; justify-content:space-between; margin-top:6px;">
              <span style="font-family:'Share Tech Mono',monospace; font-size:0.58rem; color:var(--dim);">${date}</span>
              <span class="sub-vc">⬡ ${(s.vc_reward||0).toLocaleString()} VC</span>
            </div>
          </div>
          ${isPending ? `
          <div class="sub-footer">
            <button class="approve-btn" onclick="reviewSubmission('${s.id}','approved')">✓ APPROVE + CREDIT VC</button>
            <button class="reject-btn"  onclick="reviewSubmission('${s.id}','rejected')">✕ REJECT</button>
          </div>` : ''}
        </div>`;
    }).join('');
  }

  // ── ACTIONS ──
  async function toggleMission(id, status) {
    try {
      const r = await fetch(`${BACKEND}/api/missions/admin/update`, {
        method: 'POST', headers: h(),
        body: JSON.stringify({ mission_id: id, status })
      });
      const d = await r.json();
      if (d.status === 'success') { showToast(`✅ Mission ${status}`, true); await loadMissions(); }
      else showToast(d.message || 'Failed');
    } catch(e) { showToast('// ERROR'); }
  }

  async function reviewSubmission(subId, decision) {
    try {
      const r = await fetch(`${BACKEND}/api/missions/review`, {
        method: 'POST', headers: h(),
        body: JSON.stringify({ submission_id: subId, decision })
      });
      const d = await r.json();
      if (d.status === 'success') {
        const msg = decision === 'approved' ? `✅ Approved! ${d.vc_credited} VC credited` : '✕ Rejected';
        showToast(msg, decision === 'approved');
        await Promise.all([loadSubmissions(), loadMissions()]);
      } else { showToast(d.message || 'Failed'); }
    } catch(e) { showToast('// ERROR'); }
  }

  // ── FILTERS & TABS ──
  function setMissionFilter(f, btn) {
    missionFilter = f;
    document.querySelectorAll('#tabManage .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderManageMissions();
  }

  function setSubFilter(f, btn) {
    subFilter = f;
    document.querySelectorAll('#tabReview .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderReview();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => {
      const tabs = ['post','manage','review'];
      b.classList.toggle('active', tabs[i] === tab);
    });
    document.getElementById('tabPost').style.display    = tab === 'post'    ? '' : 'none';
    document.getElementById('tabManage').style.display  = tab === 'manage'  ? '' : 'none';
    document.getElementById('tabReview').style.display  = tab === 'review'  ? '' : 'none';
  }

  function h() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }; }

  function showToast(msg, isOk = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'toast' + (isOk ? ' ok' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  init();
</script>
</body>
</html>
