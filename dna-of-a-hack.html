<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA of a Hack</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #060708;
  --s1:     #0a0c0f;
  --s2:     #0e1115;
  --s3:     #13161c;
  --border: #1a1f28;
  --red:    #ff2244;
  --red2:   #ff4466;
  --green:  #00ff88;
  --green2: #00cc66;
  --amber:  #ffaa00;
  --blue:   #0088ff;
  --cyan:   #00ccff;
  --purple: #aa55ff;
  --text:   #c8d8e8;
  --muted:  #3a4858;
  --muted2: #5a6878;
  --mono:   'Share Tech Mono', monospace;
  --display:'Bebas Neue', sans-serif;
  --ui:     'Rajdhani', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* ══════════════════════════════════════════
   SELECTION SCREEN
══════════════════════════════════════════ */
#screen-select {
  padding:2rem 1.5rem 3rem;
  background:var(--bg);
  position:relative;
  overflow:hidden;
}
#screen-select::before {
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,34,68,0.06) 0%, transparent 60%),
    repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(26,31,40,0.4) 60px,rgba(26,31,40,0.4) 61px),
    repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(26,31,40,0.4) 60px,rgba(26,31,40,0.4) 61px);
  pointer-events:none;
}

.sel-header{text-align:center;padding:2rem 0 2.5rem;position:relative;}
.sel-eyebrow{
  font-family:var(--mono);font-size:0.62rem;
  letter-spacing:0.3em;color:var(--red);
  text-transform:uppercase;margin-bottom:0.8rem;
  animation:fadeIn 0.8s ease;
}
.sel-title{
  font-family:var(--display);
  font-size:clamp(2.5rem,8vw,5rem);
  letter-spacing:0.05em;color:#fff;
  line-height:1;margin-bottom:0.5rem;
  animation:fadeIn 0.8s ease 0.2s both;
}
.sel-title span{color:var(--red);text-shadow:0 0 40px rgba(255,34,68,0.5);}
.sel-sub{
  font-size:0.9rem;color:var(--muted2);
  max-width:480px;margin:0 auto;line-height:1.7;
  animation:fadeIn 0.8s ease 0.4s both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.breach-grid{
  display:flex;
  flex-direction:row;
  gap:1px;background:var(--border);
  border:1px solid var(--border);
  border-radius:6px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;
  scroll-padding:0;
  position:relative;
  max-width:960px;margin:0 auto;
  /* hide scrollbar but keep scroll */
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.breach-grid::-webkit-scrollbar{display:none;}

@media(min-width:700px){
  .breach-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    overflow:hidden;
    scroll-snap-type:none;
  }
}

.breach-card{
  background:var(--s1);
  padding:1.4rem 1.6rem;
  cursor:pointer;
  transition:all 0.2s;
  position:relative;
  overflow:hidden;
  animation:fadeIn 0.5s ease both;
  /* mobile swipe snap */
  scroll-snap-align:start;
  flex-shrink:0;
  width:80vw;
  max-width:300px;
}
@media(min-width:700px){
  .breach-card{
    width:auto;
    max-width:none;
    scroll-snap-align:unset;
  }
}
.breach-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  transition:background 0.2s;
}
.breach-card:hover{background:var(--s2);}
.breach-card:hover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,34,68,0.04) 0%,transparent 60%);
  pointer-events:none;
}

.bc-year{
  font-family:var(--mono);font-size:0.58rem;
  letter-spacing:0.15em;color:var(--muted2);
  margin-bottom:0.4rem;text-transform:uppercase;
}
.bc-title{
  font-family:var(--display);font-size:1.4rem;
  letter-spacing:0.05em;color:#fff;
  margin-bottom:0.3rem;line-height:1.1;
}
.bc-victim{font-family:var(--mono);font-size:0.65rem;color:var(--muted2);margin-bottom:0.7rem;}
.bc-desc{font-size:0.78rem;color:var(--muted2);line-height:1.6;margin-bottom:0.8rem;}
.bc-tags{display:flex;flex-wrap:wrap;gap:0.3rem;}
.bc-tag{
  font-family:var(--mono);font-size:0.58rem;
  padding:2px 7px;border-radius:2px;
  border:1px solid;letter-spacing:0.06em;
}
.bc-severity{
  position:absolute;top:1rem;right:1rem;
  font-family:var(--mono);font-size:0.55rem;
  padding:2px 6px;border-radius:2px;
  letter-spacing:0.1em;font-weight:600;
}
.sev-critical{background:rgba(255,34,68,0.15);color:var(--red);border:1px solid rgba(255,34,68,0.3);}
.sev-high{background:rgba(255,170,0,0.12);color:var(--amber);border:1px solid rgba(255,170,0,0.25);}

/* ══════════════════════════════════════════
   MOVIE SCREEN
══════════════════════════════════════════ */
#screen-movie{
  background:var(--bg);
  padding:0;
}

/* top bar */
.movie-topbar{
  display:flex;align-items:center;
  padding:0.8rem 1.5rem;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  gap:1rem;flex-shrink:0;
  position:relative;
}
.movie-topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  opacity:0.3;
}
.mtb-back{
  font-family:var(--mono);font-size:0.65rem;
  color:var(--muted2);cursor:pointer;
  padding:0.3rem 0.7rem;border:1px solid var(--border);
  border-radius:2px;transition:all 0.15s;flex-shrink:0;
}
.mtb-back:hover{border-color:var(--red);color:var(--red);}
.mtb-title{
  font-family:var(--display);font-size:1.1rem;
  letter-spacing:0.08em;color:#fff;flex:1;
}
.mtb-stage{
  font-family:var(--mono);font-size:0.62rem;
  color:var(--muted2);letter-spacing:0.1em;
  flex-shrink:0;
}

/* progress timeline */
.timeline-bar{
  display:flex;gap:1px;background:var(--border);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.timeline-bar::-webkit-scrollbar{display:none;}
.tb-stage{
  flex:1;min-width:60px;padding:0.5rem 0.4rem;
  text-align:center;
  background:var(--s1);
  font-family:var(--mono);font-size:0.52rem;
  color:var(--muted);letter-spacing:0.06em;
  text-transform:uppercase;
  transition:all 0.4s;cursor:pointer;
  border-bottom:2px solid transparent;
  line-height:1.3;
  white-space:nowrap;
}
.tb-stage:hover{background:var(--s2);}
.tb-stage.active{
  background:var(--s2);
  color:var(--text);
  border-bottom-color:var(--red);
}
.tb-stage.done{
  color:var(--green2);
  border-bottom-color:var(--green2);
}
.tb-stage-num{font-size:0.65rem;font-weight:700;display:block;margin-bottom:1px;}

/* scene area */
.scene-area{
  flex:1;
  overflow-y:auto;
  padding:2rem 1.5rem;
  scroll-behavior:smooth;
}
.scene-area::-webkit-scrollbar{width:3px;}
.scene-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* scene */
.scene{
  max-width:760px;margin:0 auto;
  opacity:0;transform:translateY(16px);
  transition:opacity 0.5s ease,transform 0.5s ease;
}
.scene.visible{opacity:1;transform:translateY(0);}

.scene-stamp{
  font-family:var(--mono);font-size:0.6rem;
  letter-spacing:0.2em;color:var(--red);
  text-transform:uppercase;margin-bottom:0.6rem;
  display:flex;align-items:center;gap:0.5rem;
}
.scene-stamp::after{content:'';flex:1;height:1px;background:rgba(255,34,68,0.2);}

.scene-title{
  font-family:var(--display);
  font-size:clamp(1.4rem,4vw,2rem);
  letter-spacing:0.05em;color:#fff;
  margin-bottom:0.8rem;line-height:1.1;
}

/* typewriter narrative */
.narrative{
  font-family:var(--mono);font-size:0.78rem;
  color:var(--muted2);line-height:2;
  margin-bottom:1.5rem;
  min-height:2rem;
}
.narrative .cursor{
  display:inline-block;width:8px;height:14px;
  background:var(--red);vertical-align:middle;
  animation:blink-cursor 0.7s infinite;
  margin-left:2px;
}
@keyframes blink-cursor{0%,100%{opacity:1}50%{opacity:0}}

/* attack diagram */
.diagram{
  margin:1.5rem 0;
  background:var(--s2);
  border:1px solid var(--border);
  border-radius:5px;
  padding:1.2rem;
  position:relative;
  overflow:hidden;
}
.diagram::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  opacity:0.3;
}
.diag-label{
  font-family:var(--mono);font-size:0.55rem;
  letter-spacing:0.15em;color:var(--muted);
  text-transform:uppercase;margin-bottom:1rem;
}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0.5rem;}
.flow-node{
  padding:0.4rem 0.8rem;
  border-radius:3px;
  font-family:var(--mono);font-size:0.7rem;
  border:1px solid;
  opacity:0;transform:scale(0.8);
  transition:opacity 0.4s ease,transform 0.4s ease;
  line-height:1.3;text-align:center;
}
.flow-node.show{opacity:1;transform:scale(1);}
.flow-node.attacker{background:rgba(255,34,68,0.1);border-color:rgba(255,34,68,0.4);color:var(--red2);}
.flow-node.victim{background:rgba(0,136,255,0.08);border-color:rgba(0,136,255,0.3);color:#44aaff;}
.flow-node.data{background:rgba(255,170,0,0.08);border-color:rgba(255,170,0,0.25);color:var(--amber);}
.flow-node.system{background:rgba(0,255,136,0.06);border-color:rgba(0,255,136,0.2);color:var(--green);}
.flow-node.tool{background:rgba(170,85,255,0.08);border-color:rgba(170,85,255,0.25);color:var(--purple);}
.flow-arrow{
  color:var(--muted);font-size:1rem;
  opacity:0;transition:opacity 0.4s ease 0.2s;
  flex-shrink:0;
}
.flow-arrow.show{opacity:1;}

/* quote block */
.quote-block{
  margin:1rem 0;
  padding:1rem 1.2rem;
  background:rgba(0,0,0,0.3);
  border-left:3px solid var(--amber);
  border-radius:0 4px 4px 0;
  font-family:var(--mono);font-size:0.73rem;
  color:var(--amber);line-height:1.8;
  opacity:0;transform:translateX(-8px);
  transition:opacity 0.4s ease,transform 0.4s ease;
}
.quote-block.show{opacity:1;transform:translateX(0);}
.quote-block em{display:block;font-size:0.6rem;color:var(--muted2);margin-top:0.4rem;font-style:normal;}

/* impact box */
.impact-box{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:4px;
  overflow:hidden;margin:1rem 0;
}
.ib-item{
  background:var(--s2);padding:0.8rem;text-align:center;
  opacity:0;transform:translateY(8px);
  transition:opacity 0.4s ease,transform 0.4s ease;
}
.ib-item.show{opacity:1;transform:translateY(0);}
.ib-val{
  font-family:var(--display);font-size:1.5rem;
  letter-spacing:0.05em;margin-bottom:0.2rem;
}
.ib-label{font-family:var(--mono);font-size:0.58rem;color:var(--muted2);letter-spacing:0.1em;}

/* defense box */
.defense-box{
  background:rgba(0,255,136,0.04);
  border:1px solid rgba(0,255,136,0.2);
  border-radius:4px;padding:1rem 1.2rem;
  margin:1rem 0;
  opacity:0;transition:opacity 0.5s ease;
}
.defense-box.show{opacity:1;}
.db-title{
  font-family:var(--mono);font-size:0.6rem;
  letter-spacing:0.15em;color:var(--green);
  text-transform:uppercase;margin-bottom:0.7rem;
}
.db-item{
  display:flex;align-items:flex-start;gap:0.5rem;
  font-size:0.75rem;color:var(--muted2);
  margin-bottom:0.4rem;line-height:1.5;
}
.db-item::before{content:'✓';color:var(--green);flex-shrink:0;font-family:var(--mono);}

/* nav buttons */
.scene-nav{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:2rem;padding-top:1.5rem;
  border-top:1px solid var(--border);
}
.nav-btn{
  font-family:var(--ui);font-weight:700;
  font-size:0.8rem;letter-spacing:0.1em;
  text-transform:uppercase;
  padding:0.65rem 1.5rem;
  border-radius:3px;cursor:pointer;
  transition:all 0.2s;border:1px solid;
}
.nav-next{
  background:var(--red);border-color:var(--red);
  color:#fff;box-shadow:0 0 16px rgba(255,34,68,0.3);
}
.nav-next:hover{box-shadow:0 0 28px rgba(255,34,68,0.5);transform:translateY(-1px);}
.nav-prev{background:transparent;border-color:var(--border);color:var(--muted2);}
.nav-prev:hover{border-color:var(--muted2);color:var(--text);}
.nav-finish{
  background:var(--green2);border-color:var(--green2);
  color:#000;box-shadow:0 0 16px rgba(0,204,102,0.3);
}
.nav-finish:hover{box-shadow:0 0 28px rgba(0,204,102,0.5);}

/* stage label */
.stage-label{
  display:inline-flex;align-items:center;gap:0.4rem;
  font-family:var(--mono);font-size:0.6rem;
  padding:0.3rem 0.7rem;border-radius:2px;
  margin-bottom:0.8rem;letter-spacing:0.1em;
  text-transform:uppercase;border:1px solid;
}

/* ══════════════════════════════════════════
   CREDITS SCREEN
══════════════════════════════════════════ */
#screen-credits{
  padding:3rem 1.5rem;
  text-align:center;
  justify-content:center;align-items:center;gap:1.5rem;
}
.cred-title{
  font-family:var(--display);
  font-size:clamp(1.5rem,5vw,3rem);
  letter-spacing:0.1em;color:var(--green);
  text-shadow:0 0 30px rgba(0,255,136,0.4);
}
.cred-sub{font-family:var(--mono);font-size:0.75rem;color:var(--muted2);letter-spacing:0.1em;}
.cred-lesson{
  max-width:500px;
  background:var(--s1);border:1px solid var(--border);
  border-radius:5px;padding:1.5rem;
  font-size:0.85rem;color:var(--text);line-height:1.8;
  text-align:left;
}
.cred-lesson strong{color:var(--green);}
.btn-restart{
  font-family:var(--display);font-size:0.9rem;
  letter-spacing:0.15em;padding:0.7rem 2rem;
  background:transparent;border:1px solid var(--green2);
  border-radius:3px;color:var(--green2);cursor:pointer;
  transition:all 0.2s;
}
.btn-restart:hover{background:rgba(0,204,102,0.1);}
.btn-select-more{
  font-family:var(--mono);font-size:0.68rem;
  letter-spacing:0.1em;padding:0.5rem 1.2rem;
  background:transparent;border:1px solid var(--border);
  border-radius:3px;color:var(--muted2);cursor:pointer;
  transition:all 0.2s;margin-top:0.5rem;
}
.btn-select-more:hover{border-color:var(--muted2);color:var(--text);}

/* search bar */
.sel-search-wrap{
  margin-top:1.2rem;
  max-width:400px;
  margin-left:auto;margin-right:auto;
}
.sel-search{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:3px;
  padding:0.6rem 1rem;
  font-family:var(--mono);
  font-size:0.72rem;
  color:var(--text);
  letter-spacing:0.05em;
  outline:none;
  transition:border-color 0.2s;
}
.sel-search:focus{border-color:var(--red);}
.sel-search::placeholder{color:var(--muted);}
</style>
</head>
<body>

<!-- ── SELECTION SCREEN ── -->
<div class="screen active" id="screen-select">
  <div class="sel-header">
    <div class="sel-eyebrow">● Documentary Series</div>
    <div class="sel-title">DNA OF A <span>HACK</span></div>
    <div class="sel-sub">Real world breaches. Animated step by step. Understand exactly how it happened — and what could have stopped it.</div>
    <div class="sel-search-wrap">
      <input type="text" id="breach-search" class="sel-search" placeholder="Search breaches, tags, techniques…" oninput="filterBreaches(this.value)">
    </div>
  </div>
  <div class="breach-grid" id="breach-grid"></div>
</div>

<!-- ── MOVIE SCREEN ── -->
<div class="screen" id="screen-movie">
  <div class="movie-topbar">
    <div class="mtb-back" onclick="goBack()">← BACK</div>
    <div class="mtb-title" id="mtb-title">—</div>
    <div class="mtb-stage" id="mtb-stage">Stage 1 of 6</div>
  </div>
  <div class="timeline-bar" id="timeline-bar"></div>
  <div class="scene-area" id="scene-area"></div>
</div>

<!-- ── CREDITS SCREEN ── -->
<div class="screen" id="screen-credits">
  <div class="cred-title" id="cred-title">BREACH COMPLETE</div>
  <div class="cred-sub" id="cred-sub">—</div>
  <div class="cred-lesson" id="cred-lesson"></div>
  <button class="btn-restart" onclick="replayBreach()">↺ REPLAY</button>
  <button class="btn-select-more" onclick="goBack()">← Choose Another Breach</button>
</div>

<script>
// ══════════════════════════════════════════
// BREACH DATABASE
// ══════════════════════════════════════════
const BREACHES = [
  {
    id:'twitter2020',
    year:'JULY 2020',
    title:'TWITTER',
    victim:'Twitter / X Corp',
    color:'#1da1f2',
    severity:'critical',
    tags:['Social Engineering','Insider Threat','Crypto Scam'],
    desc:'Hackers hijacked Barack Obama, Elon Musk, Apple and 130 other high-profile accounts to run a Bitcoin scam — netting $120,000 in hours.',
    impact:{ records:'130 Accounts', loss:'$120,000', duration:'24 Hours', method:'Phone Spear-Phishing' },
    lesson:'A single phished employee with enough access can compromise the accounts of world leaders. Privileged access management and 2FA on internal tools are non-negotiable.',
    stages:[
      {
        label:'RECONNAISSANCE', labelColor:'#ff2244',
        title:'Finding the Weakest Link',
        narrative:"It's July 15, 2020. Three young hackers — including a 17-year-old from Florida — begin mapping Twitter's internal infrastructure. Their target isn't a server. It's a person. They scan LinkedIn, find Twitter employees in IT support and internal tools teams. Phone numbers are found via social media and public records.",
        diagram:{
          label:'Attack Vector — Social Graph Mapping',
          nodes:[
            {t:'Hackers',c:'attacker'},{a:true},
            {t:'LinkedIn Recon',c:'tool'},{a:true},
            {t:'Twitter IT Staff',c:'victim'},{a:true},
            {t:'Phone Numbers',c:'data'}
          ]
        },
        quote:{ text:'"We found a way to get to the employees — we didn\'t need to hack Twitter directly. We hacked the humans."', src:'— Reconstructed from court documents' },
        defense:['Limit employee personal information indexed publicly','Implement social engineering awareness training','Remove personal contact info from internal directories']
      },
      {
        label:'SOCIAL ENGINEERING', labelColor:'#ffaa00',
        title:'The Phone Call',
        narrative:"The attackers call Twitter employees posing as IT staff. They claim there's a VPN issue and need the employee to verify credentials through a fake internal portal. The employees, trained to be helpful, comply. Within hours, the hackers have credentials to Twitter's internal admin tools — including \"God Mode\": a panel that can access any account.",
        diagram:{
          label:'Vishing Attack Chain',
          nodes:[
            {t:'Fake IT Call',c:'attacker'},{a:true},
            {t:'Twitter Employee',c:'victim'},{a:true},
            {t:'Fake VPN Portal',c:'tool'},{a:true},
            {t:'Credentials Stolen',c:'data'},{a:true},
            {t:'Admin Access',c:'system'}
          ]
        },
        quote:{ text:'"Hi, this is the IT helpdesk. We\'re seeing issues with your VPN token. Can you verify through our portal?"', src:'— Reconstructed phishing script' },
        defense:['Verify all IT requests through official ticketing systems','Never provide credentials over the phone','Implement callback verification for sensitive requests']
      },
      {
        label:'INITIAL ACCESS', labelColor:'#aa55ff',
        title:'Inside God Mode',
        narrative:"With stolen credentials, the attackers log into Twitter's internal admin panel — nicknamed 'God Mode' by employees. This tool was originally built for customer support. It could: change email addresses, disable 2FA, and control any account on the platform. The hackers now had full control of every account on Twitter.",
        diagram:{
          label:'Internal Tool Access',
          nodes:[
            {t:'Stolen Creds',c:'data'},{a:true},
            {t:'"God Mode" Panel',c:'system'},{a:true},
            {t:'Any Twitter Account',c:'victim'},{a:true},
            {t:'Full Control',c:'attacker'}

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let currentBreach = null;
let currentStage = 0;
let typeInterval = null;

// ══════════════════════════════════════════
// RENDER SELECTION
// ══════════════════════════════════════════
function buildCard(b, i) {
  const card = document.createElement('div');
  card.className = 'breach-card';
  card.style.animationDelay = `${0.1 + i*0.08}s`;
  card.style.setProperty('--bc', b.color);
  card.innerHTML = `
    <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${b.color};opacity:0.8"></div>
    <div class="bc-severity sev-${b.severity}">${b.severity.toUpperCase()}</div>
    <div class="bc-year">${b.year}</div>
    <div class="bc-title" style="color:${b.color};text-shadow:0 0 20px ${b.color}44">${b.title}</div>
    <div class="bc-victim">${b.victim}</div>
    <div class="bc-desc">${b.desc}</div>
    <div class="bc-tags">
      ${b.tags.map(t=>`<span class="bc-tag" style="color:${b.color};border-color:${b.color}44;background:${b.color}10">${t}</span>`).join('')}
    </div>
  `;
  card.onclick = () => startBreach(b);
  return card;
}

function renderSelection() {
  const grid = document.getElementById('breach-grid');
  grid.innerHTML = '';
  BREACHES.forEach((b, i) => grid.appendChild(buildCard(b, i)));
}

function filterBreaches(query) {
  const q = query.toLowerCase().trim();
  const grid = document.getElementById('breach-grid');
  grid.innerHTML = '';
  const filtered = q
    ? BREACHES.filter(b =>
        b.title.toLowerCase().includes(q) ||
        b.victim.toLowerCase().includes(q) ||
        b.year.toLowerCase().includes(q) ||
        b.desc.toLowerCase().includes(q) ||
        b.tags.some(t => t.toLowerCase().includes(q)) ||
        b.severity.toLowerCase().includes(q)
      )
    : BREACHES;
  if(!filtered.length) {
    grid.innerHTML = `<div style="padding:2rem;color:var(--muted);font-family:var(--mono);font-size:0.75rem;">NO BREACHES FOUND</div>`;
    return;
  }
  filtered.forEach((b, i) => grid.appendChild(buildCard(b, i)));
}

// ══════════════════════════════════════════
// START BREACH
// ══════════════════════════════════════════
function startBreach(breach) {
  currentBreach = breach;
  currentStage = 0;
  showScreen('screen-movie');
  document.getElementById('mtb-title').textContent = breach.year + ' — ' + breach.title;
  renderTimeline();
  renderStage(0);
}

function renderTimeline() {
  const bar = document.getElementById('timeline-bar');
  bar.innerHTML = currentBreach.stages.map((s,i) => `
    <div class="tb-stage ${i===0?'active':''}" id="tbst_${i}" onclick="jumpToStage(${i})">
      <span class="tb-stage-num">${String(i+1).padStart(2,'0')}</span>
      ${s.label}
    </div>
  `).join('');
}

function updateTimeline(idx) {
  currentBreach.stages.forEach((_,i) => {
    const el = document.getElementById(`tbst_${i}`);
    if(!el) return;
    el.classList.remove('active','done');
    if(i < idx) el.classList.add('done');
    else if(i === idx) el.classList.add('active');
  });
  document.getElementById('mtb-stage').textContent = `Stage ${idx+1} of ${currentBreach.stages.length}`;
  // Scroll active stage into view in the timeline bar
  const activeEl = document.getElementById(`tbst_${idx}`);
  if(activeEl) activeEl.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

function jumpToStage(idx) {
  if(typeInterval) clearInterval(typeInterval);
  currentStage = idx;
  renderStage(idx);
}

// ══════════════════════════════════════════
// RENDER STAGE
// ══════════════════════════════════════════
function renderStage(idx) {
  if(typeInterval) clearInterval(typeInterval);
  const stage = currentBreach.stages[idx];
  const area = document.getElementById('scene-area');
  area.scrollTop = 0;
  updateTimeline(idx);

  const isLast = idx === currentBreach.stages.length - 1;
  const color = stage.labelColor || '#ff2244';

  area.innerHTML = `
    <div class="scene" id="main-scene">
      <div class="scene-stamp">${currentBreach.year}</div>
      <div class="stage-label" style="color:${color};border-color:${color}44;background:${color}0d">
        <span style="width:6px;height:6px;border-radius:50%;background:${color};display:inline-block"></span>
        ${stage.label}
      </div>
      <div class="scene-title">${stage.title}</div>
      <div class="narrative" id="narrative-text"><span class="cursor"></span></div>

      ${stage.diagram ? renderDiagram(stage.diagram) : ''}
      ${stage.quote ? `<div class="quote-block" id="quote-el">${stage.quote.text}<em>${stage.quote.src}</em></div>` : ''}

      <div class="defense-box" id="defense-el">
        <div class="db-title">🛡️ How This Could Have Been Prevented</div>
        ${stage.defense.map(d=>`<div class="db-item">${d}</div>`).join('')}
      </div>

      ${currentBreach.impact && idx === currentBreach.stages.length - 2 ? renderImpact() : ''}

      <div class="scene-nav">
        ${idx > 0 ? `<button class="nav-btn nav-prev" onclick="renderStage(${idx-1})">← Previous</button>` : '<div></div>'}
        ${isLast
          ? `<button class="nav-btn nav-finish" onclick="showCredits()">🏁 View Summary</button>`
          : `<button class="nav-btn nav-next" onclick="renderStage(${idx+1})">Next Stage →</button>`}
      </div>
    </div>
  `;

  // Animate scene in
  requestAnimationFrame(() => {
    document.getElementById('main-scene').classList.add('visible');
    typeWriter(stage.narrative, 'narrative-text', () => {
      showDiagramNodes();
      setTimeout(() => {
        const q = document.getElementById('quote-el');
        if(q) q.classList.add('show');
        setTimeout(() => {
          const d = document.getElementById('defense-el');
          if(d) d.classList.add('show');
          showImpactItems();
        }, 400);
      }, 300);
    });
  });
}

function renderDiagram(diag) {
  const nodes = diag.nodes.map((n,i) => {
    if(n.a) return `<div class="flow-arrow" data-arrow="${i}">→</div>`;
    return `<div class="flow-node ${n.c||''}" data-node="${i}">${n.t}</div>`;
  }).join('');
  return `<div class="diagram">
    <div class="diag-label">${diag.label}</div>
    <div class="flow">${nodes}</div>
  </div>`;
}

function showDiagramNodes() {
  const nodes = document.querySelectorAll('.flow-node');
  const arrows = document.querySelectorAll('.flow-arrow');
  nodes.forEach((n,i) => setTimeout(() => n.classList.add('show'), i*120));
  arrows.forEach((a,i) => setTimeout(() => a.classList.add('show'), i*120+60));
}

function renderImpact() {
  const imp = currentBreach.impact;
  return `<div class="impact-box">
    ${Object.entries(imp).map(([k,v])=>`
      <div class="ib-item" data-impact>
        <div class="ib-val" style="color:var(--red)">${v}</div>
        <div class="ib-label">${k.replace('_',' ').toUpperCase()}</div>
      </div>
    `).join('')}
  </div>`;
}

function showImpactItems() {
  document.querySelectorAll('[data-impact]').forEach((el,i) => {
    setTimeout(() => el.classList.add('show'), i*100);
  });
}

// ══════════════════════════════════════════
// TYPEWRITER
// ══════════════════════════════════════════
function typeWriter(text, targetId, callback) {
  const el = document.getElementById(targetId);
  if(!el) return;
  let i = 0;
  const speed = 18;
  el.innerHTML = '<span class="cursor"></span>';

  typeInterval = setInterval(() => {
    if(i < text.length) {
      el.innerHTML = text.slice(0,i+1) + '<span class="cursor"></span>';
      i++;
    } else {
      clearInterval(typeInterval);
      typeInterval = null;
      el.innerHTML = text;
      if(callback) callback();
    }
  }, speed);

  // Tap anywhere on scene to skip typewriter
  const area = document.getElementById('scene-area');
  const skipHandler = () => {
    if(typeInterval) {
      clearInterval(typeInterval);
      typeInterval = null;
      el.innerHTML = text;
      area.removeEventListener('click', skipHandler);
      if(callback) callback();
    }
  };
  area.addEventListener('click', skipHandler, { once: true });
}

// ══════════════════════════════════════════
// SWIPE GESTURES
// ══════════════════════════════════════════
(function initSwipe() {
  let startX = 0, startY = 0;
  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if(!currentBreach) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    // Only fire if horizontal swipe (not scroll)
    if(Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const activeScreen = document.querySelector('.screen.active');
    if(!activeScreen || activeScreen.id !== 'screen-movie') return;
    if(dx < 0 && currentStage < currentBreach.stages.length - 1) {
      // Swipe left → next
      if(typeInterval) clearInterval(typeInterval);
      currentStage++;
      renderStage(currentStage);
    } else if(dx > 0 && currentStage > 0) {
      // Swipe right → previous
      if(typeInterval) clearInterval(typeInterval);
      currentStage--;
      renderStage(currentStage);
    }
  }, { passive: true });
})();

// ══════════════════════════════════════════
// CREDITS
// ══════════════════════════════════════════
function showCredits() {
  showScreen('screen-credits');
  document.getElementById('cred-title').textContent = currentBreach.title + ' — CASE CLOSED';
  document.getElementById('cred-title').style.color = currentBreach.color;
  document.getElementById('cred-sub').textContent = currentBreach.year + ' · ' + currentBreach.victim;

  const imp = currentBreach.impact;
  document.getElementById('cred-lesson').innerHTML = `
    <strong>Key Lesson:</strong><br>${currentBreach.lesson}<br><br>
    <strong>Impact:</strong><br>
    ${Object.entries(imp).map(([k,v])=>`<strong style="color:${currentBreach.color}">${v}</strong> — ${k.replace(/_/g,' ')}`).join('<br>')}
  `;
}

function replayBreach() {
  currentStage = 0;
  showScreen('screen-movie');
  renderTimeline();
  renderStage(0);
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goBack() {
  if(typeInterval) clearInterval(typeInterval);
  showScreen('screen-select');
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
renderSelection();
</script>
