<style>

  :root {
    --bg: #020408;
    --bg2: #060d14;
    --panel: #0a1520;
    --border: #1a3a4a;
    --red: #ff2244;
    --cyan: #00ffcc;
    --cyan2: #00c9a7;
    --dim: #3a6070;
    --text: #a0d0d8;
    --white: #e0f0f4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline effect */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,255,204,0.015) 2px,
      rgba(0,255,204,0.015) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Grid background */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(0,255,204,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,204,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--red);
    padding-bottom: 12px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--white);
  }

  .logo span { color: var(--red); }

  .status {
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 2px;
    animation: blink 2s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 5vw, 32px);
    font-weight: 900;
    color: var(--white);
    letter-spacing: 4px;
    margin-bottom: 6px;
  }

  h1 span { color: var(--cyan); }

  .subtitle {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 2px;
    margin-bottom: 28px;
  }

  /* Input section */
  .input-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 2px solid var(--cyan);
    padding: 20px;
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 10px;
    color: var(--red);
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  @media (max-width: 600px) {
    .input-row { grid-template-columns: 1fr; }
  }

  .field-wrap { display: flex; flex-direction: column; gap: 6px; }

  .field-label {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 2px;
  }

  input[type="text"] {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input[type="text"]:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,255,204,0.1);
  }

  input[type="text"]::placeholder { color: var(--dim); }

  /* Category grid */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }

  .cat-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 8px 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .cat-btn:hover {
    border-color: var(--cyan2);
    color: var(--cyan);
  }

  .cat-btn.active {
    background: rgba(0,255,204,0.08);
    border-color: var(--cyan);
    color: var(--cyan);
  }

  .cat-btn .cat-icon { margin-right: 6px; }

  /* Generate button */
  .gen-btn {

    background: var(--cyan);
    color: var(--bg);
    border: none;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }

  .gen-btn:hover {
    background: var(--white);
    box-shadow: 0 0 20px rgba(0,255,204,0.3);
  }

  .gen-btn:active { transform: scale(0.99); }

  /* Results */
  .results-section {
    display: none;
  }

  .results-section.show { display: block; }

  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .results-count {
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 2px;
  }

  .copy-all-btn {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .copy-all-btn:hover {
    background: var(--red);
    color: var(--bg);
  }

  /* Category result block */
  .result-block {
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 12px;
    overflow: hidden;
  }

  .result-block-header {
    background: rgba(255,34,68,0.08);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    font-size: 10px;
    color: var(--red);
    letter-spacing: 3px;
    display: flex;
    justify-content: space-between;

  .dork-item {
    display: flex;

    justify-content: space-between;

    color: var(--cyan2);

  .dork-label {
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 1px;

  .copy-btn {
    background: transparent;

    color: var(--dim);

  /* Empty state */

    padding: 40px 20px;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 2px;

    color: var(--dim);

    margin-top: 30px;

    const header = document.createElement('div');
    header.className = 'result-block-header';
    header.innerHTML = `<span>// ${data.label}</span><span>${data.items.length} DORKS</span>`;
    block.appendChild(header);

    data.items.forEach(item => {
      const dork = item.dork(domain, keyword);
      const row = document.createElement('div');
      row.className = 'dork-item';
      row.innerHTML = `
        <span class="dork-label">${item.label}</span>
        <span class="dork-text">${dork}</span>
        <button class="copy-btn" onclick="copyDork(this, \`${dork.replace(/`/g, '\\`')}\`)">COPY</button>
      `;
      block.appendChild(row);
      total++;
    });

    list.appendChild(block);
  });

  document.getElementById('resultsCount').textContent = `// ${total} DORKS GENERATED`;
  const resultsEl = document.getElementById('results');
  resultsEl.classList.add('show');
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyDork(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'COPIED';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'COPY';
      btn.classList.remove('copied');
    }, 1500);
  });
}

function copyAll() {
  const dorks = [...document.querySelectorAll('.dork-text')].map(el => el.textContent).join('\n');
  navigator.clipboard.writeText(dorks).then(() => {
    const btn = document.querySelector('.copy-all-btn');
    btn.textContent = '[ COPIED! ]';
    setTimeout(() => btn.textContent = '[ COPY ALL ]', 2000);
  });
}
</script>
</body>
</html>
