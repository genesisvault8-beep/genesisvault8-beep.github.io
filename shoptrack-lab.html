<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopTrack – Order Lookup</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #f0c040;
      --accent2: #e05a2b;
      --text: #e8e8e8;
      --muted: #888;
      --green: #3ddc84;
      --red: #ff4c4c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 2px;
    }
    .logo span { color: var(--text); }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .nav-user strong { color: var(--text); }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.8rem; color: #000;
    }

    /* BREADCRUMB */
    .breadcrumb {
      padding: 14px 24px;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .breadcrumb span { color: var(--accent); }

    /* MAIN */
    main {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .page-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 32px;
      font-family: 'Space Mono', monospace;
    }

    /* ORDER CARD */
    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .order-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .order-id-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .order-id-val {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      letter-spacing: 1px;
    }
    .status-delivered { background: #1a3a2a; color: var(--green); border: 1px solid var(--green); }
    .status-processing { background: #3a2a10; color: var(--accent); border: 1px solid var(--accent); }
    .status-shipped { background: #1a2a3a; color: #5ab4ff; border: 1px solid #5ab4ff; }

    .order-card-body { padding: 20px; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .info-item label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .info-item p {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    /* ITEMS TABLE */
    .items-table { width: 100%; border-collapse: collapse; }
    .items-table th {
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      padding: 6px 0;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
    }
    .items-table td {
      padding: 10px 0;
      font-size: 0.85rem;
      border-bottom: 1px solid #222;
    }
    .items-table tr:last-child td { border-bottom: none; }
    .item-name { font-weight: 600; }
    .item-price { color: var(--accent); font-family: 'Space Mono', monospace; text-align: right; }

    /* FLAG BOX */
    .flag-box {
      background: #0a2a0a;
      border: 1px solid var(--green);
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 16px;
    }
    .flag-box-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--green);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .flag-value {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--green);
      word-break: break-all;
    }

    /* SHIPPING NOTE */
    .shipping-note {
      background: #1e1a10;
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin-top: 16px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .shipping-note strong { color: var(--text); }

    /* ACCESS DENIED */
    .access-denied {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .access-denied .icon { font-size: 3rem; margin-bottom: 16px; }
    .access-denied h2 { color: var(--red); margin-bottom: 8px; }
    .access-denied p { font-size: 0.85rem; font-family: 'Space Mono', monospace; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: #444;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    @media (max-width: 500px) {
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">SHOP<span>TRACK</span></div>
  <div class="nav-user">
    <div class="avatar">A</div>
    <div>Logged in as <strong>Alex Carter</strong></div>
  </div>
</nav>

<div class="breadcrumb">
  Home &rsaquo; My Account &rsaquo; Orders &rsaquo; <span id="bc-id">Order #1005</span>
</div>

<main>
  <div class="page-title">Order Details</div>
  <div class="page-sub" id="page-sub">Viewing order for your account</div>

  <div id="order-content"></div>
</main>

<footer>
  &copy; 2024 ShopTrack Inc. &nbsp;|&nbsp; All transactions are secured.
</footer>

<script>
  // Order database
  const orders = {

      address: "45 Maple Ave, Boston MA",
      items: [
        { name: "Wireless Mouse", qty: 1, price: "$29.99" },
        { name: "USB Hub 4-Port", qty: 2, price: "$19.99" }
      ],
      total: "$69.97",
      flag: null
    },
    1001: {
      owner: "James Okafor",
      email: "j.okafor@email.com",
      date: "Nov 14, 2024",
      status: "shipped",
      address: "22 Birch Rd, Atlanta GA",
      items: [
        { name: "Mechanical Keyboard", qty: 1, price: "$89.00" }
      ],
      total: "$89.00",
      flag: null
    },
    1002: {
      owner: "Priya Nair",
      email: "p.nair@email.com",
      date: "Nov 15, 2024",
      status: "processing",
      address: "9 Elm St, Seattle WA",
      items: [
        { name: "Laptop Stand", qty: 1, price: "$45.00" },
        { name: "Cable Management Kit", qty: 1, price: "$12.00" }
      ],
      total: "$57.00",
      flag: null
    },
    1003: {
      owner: "Carlos Mendez",
      email: "c.mendez@email.com",
      date: "Nov 16, 2024",
      status: "delivered",
      address: "101 Oak Blvd, Miami FL",
      items: [
        { name: "Webcam HD 1080p", qty: 1, price: "$59.99" }
      ],
      total: "$59.99",
      flag: null
    },
    1004: {
      owner: "Sophie Laurent",
      email: "s.laurent@email.com",
      date: "Nov 17, 2024",
      status: "shipped",
      address: "77 Pine Lane, Denver CO",
      items: [
        { name: "Monitor Light Bar", qty: 1, price: "$34.00" },
        { name: "Desk Mat XL", qty: 1, price: "$28.00" }
      ],
      total: "$62.00",
      flag: null
    },
    1005: {
      owner: "Alex Carter",
      email: "alex.carter@email.com",
      date: "Nov 18, 2024",
      status: "processing",
      address: "12 Sunset Dr, Austin TX",
      items: [
        { name: "Noise-Cancelling Headphones", qty: 1, price: "$120.00" },
        { name: "Phone Charging Stand", qty: 1, price: "$22.00" }
      ],
      total: "$142.00",
      flag: null
    },
    1006: {
      owner: "David Kim",
      email: "d.kim@email.com",
      date: "Nov 19, 2024",
      status: "delivered",
      address: "5 River Rd, Portland OR",
      items: [
        { name: "Smart Plug x4", qty: 1, price: "$39.99" }
      ],
      total: "$39.99",
      flag: null
    },
    1007: {
      owner: "Fatima Al-Hassan",
      email: "f.alhassan@email.com",
      date: "Nov 20, 2024",
      status: "shipped",
      address: "33 Cloud Ave, Phoenix AZ",
      items: [
        { name: "Ergonomic Chair Cushion", qty: 2, price: "$49.00" }
      ],
      total: "$98.00",
      flag: null
    },
    1008: {
      owner: "Admin VIP Account",
      email: "admin@shoptrack-internal.com",
      date: "Nov 21, 2024",
      status: "delivered",
      address: "HQ — Internal Fulfillment Center",
      items: [
        { name: "Server Rack Unit", qty: 1, price: "$4,200.00" },
        { name: "Internal License Key", qty: 1, price: "$0.00" }
      ],
      total: "$4,200.00",
      flag: "FLAG{1D0R_0rd3r_Acc3ss_Vuln3r4ble}"
    },
    1009: {
      owner: "Lena Fischer",
      email: "l.fischer@email.com",
      date: "Nov 21, 2024",
      status: "processing",
      address: "18 Harbor St, Chicago IL",
      items: [
        { name: "Drawing Tablet", qty: 1, price: "$199.00" }
      ],
      total: "$199.00",
      flag: null
    },
    1010: {
      owner: "Omar Shaikh",
      email: "o.shaikh@email.com",
      date: "Nov 21, 2024",
      status: "shipped",
      address: "60 Valley View, Nashville TN",
      items: [
        { name: "Portable SSD 1TB", qty: 1, price: "$89.00" },
        { name: "Type-C Cable Pack", qty: 1, price: "$15.00" }
      ],
      total: "$104.00",
      flag: null
    }
  };

  const statusLabels = {
    delivered: "DELIVERED",
    processing: "PROCESSING",
    shipped: "SHIPPED"
  };
  const statusClasses = {
    delivered: "status-delivered",
    processing: "status-processing",
    shipped: "status-shipped"
  };

  function getParam(name) {
    const url = new URLSearchParams(window.location.search);
    return url.get(name);
  }

  function render() {
    const idParam = getParam("id");
    const id = parseInt(idParam) || 1005;
    const order = orders[id];
    const container = document.getElementById("order-content");
    const bc = document.getElementById("bc-id");
    const sub = document.getElementById("page-sub");

    bc.textContent = "Order #" + id;

    if (!order) {
      container.innerHTML = `
        <div class="access-denied">
          <div class="icon">🔒</div>
          <h2>Order Not Found</h2>
          <p>Order #${id} does not exist or you don't have permission to view it.</p>
        </div>`;
      return;
    }

    const isOwnOrder = (id === 1005);
    sub.textContent = isOwnOrder
      ? "Viewing your own order"
      : `Viewing order belonging to: ${order.owner}`;

    let itemsHTML = order.items.map(item => `
      <tr>
        <td class="item-name">${item.name}</td>
        <td>${item.qty}</td>
        <td class="item-price">${item.price}</td>
      </tr>
    `).join("");

    let flagHTML = "";
    if (order.flag) {
      flagHTML = `
        <div class="flag-box">
          <div class="flag-box-label">// 🚩 FLAG CAPTURED</div>
          <div class="flag-value">${order.flag}</div>
        </div>`;
    }

    let noteHTML = "";
    if (!isOwnOrder) {
      noteHTML = `
        <div class="shipping-note">
          ⚠️ <strong>Security Notice:</strong> You are viewing an order that does not belong to your account. This should not be possible.
        </div>`;
    }

    container.innerHTML = `
      <div class="order-card">
        <div class="order-card-header">
          <div>
            <div class="order-id-label">ORDER ID</div>
            <div class="order-id-val">#${id}</div>
          </div>
          <span class="status-badge ${statusClasses[order.status]}">${statusLabels[order.status]}</span>
        </div>
        <div class="order-card-body">
          <div class="info-grid">
            <div class="info-item">
              <label>CUSTOMER NAME</label>
              <p>${order.owner}</p>
            </div>
            <div class="info-item">
              <label>EMAIL</label>
              <p>${order.email}</p>
            </div>
            <div class="info-item">
              <label>ORDER DATE</label>
              <p>${order.date}</p>
            </div>
            <div class="info-item">
              <label>SHIPPING ADDRESS</label>
              <p>${order.address}</p>
            </div>
          </div>
          <hr class="divider"/>
          <table class="items-table">
            <thead>
              <tr>
                <th>ITEM</th>
                <th>QTY</th>
                <th style="text-align:right">PRICE</th>
              </tr>
            </thead>
            <tbody>${itemsHTML}</tbody>
          </table>
          <hr class="divider"/>
          <div style="text-align:right; font-family:'Space Mono',monospace; font-size:0.9rem;">
            TOTAL: <strong style="color:var(--accent)">${order.total}</strong>
          </div>
          ${flagHTML}
          ${noteHTML}
        </div>
      </div>
    `;
  }

  render();
</script>
</body>
</html>
